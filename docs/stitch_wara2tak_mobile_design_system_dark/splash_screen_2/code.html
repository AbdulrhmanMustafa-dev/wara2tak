  <style>
    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.55; }
      70% { transform: scale(1.24); opacity: 0; }
      100% { transform: scale(1.24); opacity: 0; }
    }
    @keyframes sparklePop {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.15) rotate(12deg); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-8px); opacity: 0; }
      30% { opacity: 0.9; }
      70% { opacity: 0.9; }
      100% { transform: translateY(16px); opacity: 0; }
    }
    @keyframes slideIndeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-float-slow { animation: floatSlow 3.4s ease-in-out infinite; }
    .animate-pulse-ring { animation: pulseRing 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .animate-sparkle-pop { animation: sparklePop 2.8s ease-in-out infinite; }
    .animate-scan-line { animation: scanLine 2.4s ease-in-out infinite; }
    .animate-slide-indeterminate { animation: slideIndeterminate 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
