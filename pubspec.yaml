name: wara2tak
description: "AI-powered Document Understanding & Application Planner for university students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^8.0.1

  # Navigation
  go_router: ^14.2.1

  # Supabase
  supabase_flutter: ^2.5.6

  # AI - Google Generative AI (Gemini)
  google_generative_ai: ^0.4.6

  # HTTP Client for fallback AI providers
  http: ^1.2.0

  # Auth
  google_sign_in: ^6.2.1

  # File & Image Picking
  file_picker: ^13.3.3
  image_picker: ^1.1.2

  # PDF
  pdfx: ^2.6.0

  # Utilities
  intl: ^0.20.3
  path: ^1.9.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  dartz: ^0.10.1
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  material_symbols_icons: ^4.2670.0
  flutter_dotenv: ^6.0.2

  material_ui: any
  gotrue: any
  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - .env
